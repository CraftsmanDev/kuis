<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis Interaktif</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center px-4">

  <!-- 🎵 AUDIO MUSIK -->
  <audio id="bgMusic" loop>
    <source src="WhatsApp Audio 2026-01-13 at 06.27.55.mpeg" type="audio/mpeg">
  </audio>

  <div class="bg-white w-full max-w-2xl p-6 sm:p-8 rounded-2xl shadow-2xl relative">

    <!-- 🔊 TOMBOL MUSIK -->
    <button onclick="toggleMusic()"
      class="absolute top-4 right-4 text-indigo-600 hover:text-indigo-800 text-xl">
      <i id="musicIcon" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Judul -->
    <h1 class="text-2xl sm:text-3xl font-bold text-center text-indigo-600 mb-4">
      <i class="fa-solid fa-circle-question mr-2"></i>Kuis Interaktif
    </h1>

    <!-- Progress -->
    <div class="mb-6">
      <div class="flex justify-between text-sm mb-1 text-gray-600">
        <span id="progressText">
          <i class="fa-solid fa-list-check mr-1"></i>Soal 1 / 5
        </span>
        <span id="progressPercent">20%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div id="progressBar"
          class="bg-indigo-500 h-2 rounded-full transition-all duration-300"
          style="width: 20%"></div>
      </div>
    </div>

    <!-- Konten Kuis -->
    <div class="quiz-container">
      <div id="question" class="text-lg sm:text-xl font-semibold mb-5 text-gray-800">
        Pertanyaan
      </div>

      <form id="quizForm" class="space-y-3"></form>

      <button onclick="submitAnswer()"
        class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i>
        Kirim Jawaban
      </button>

      <div id="result" class="mt-5 text-center text-lg font-bold"></div>
    </div>
  </div>

<script>
/* ================== MUSIK ================== */
const bgMusic = document.getElementById("bgMusic");
const musicIcon = document.getElementById("musicIcon");
let isPlaying = false;

function toggleMusic() {
  if (!isPlaying) {
    bgMusic.volume = 0.3;
    bgMusic.play();
    musicIcon.className = "fa-solid fa-volume-high";
  } else {
    bgMusic.pause();
    musicIcon.className = "fa-solid fa-volume-xmark";
  }
  isPlaying = !isPlaying;
}

// Autoplay setelah klik pertama (aturan browser)
document.body.addEventListener("click", () => {
  if (!isPlaying) {
    bgMusic.volume = 0.3;
    bgMusic.play();
    musicIcon.className = "fa-solid fa-volume-high";
    isPlaying = true;
  }
}, { once: true });

/* ================== KUIS ================== */
const quizQuestions = [
 { question: "Apa saja bahasa pemrograman?", choices: ["A. php, python,dan java", "B. java, C, dan laravel", "C. C++, CSS, dan Nextjs", "D. php, xampp,dan nodejs"], correctAnswer: 0 }, { question: "Siapa Rektor Universitas ibrahimy?", choices: ["A. KHR. ACH Azaim Dhofir", "B. Albert Einstei", "C. Dr. H. Khoirul Anwar, M. H.I", "D. GUS DUR"], correctAnswer: 2 }, { question: "serangkaian instruksi yang memberitahu komputer bagaimana mengubah satu set fakta tentang dunia menjadi informasi yang berguna. pernyataan tersebut merupakan pengertian dari?", choices: ["A. Algoritma", "B. Logika", "C. Teknologi", "D. Komputer"], correctAnswer: 0 }, { question: "Apa kepanjangan dari HTML?", choices: ["A. HyperText Makeup Language", "B. HyperText Markup Language", "C. HighText Markup Language", "D. HyperTool Markup Language"], correctAnswer: 1 }, { question: "Siapa Bupati Situbondo?", choices: ["A. Mas Ilzam", "B. Mas Alex", "C. Mas Rio", "D. Mas Lutfi"], correctAnswer: 2 }, { question: "Apa fungsi utama dari sistem operasi?", choices: ["A. Mengedit gambar", "B. Menyimpan data secara online", "C. Mengelola perangkat keras dan perangkat lunak", "D. Membuat desain grafis"], correctAnswer: 2 }, { question: "Siapa penemu bahasa pemrograman Python?", choices: ["A. Dennis Ritchie", "B. Guido van Rossum", "C. Bjarne Stroustrup", "D. James Gosling"], correctAnswer: 1 }, { question: "Apa itu Git?", choices: ["A. Bahasa pemrograman", "B. Web browser", "C. Sistem version control", "D. Framework JavaScript"], correctAnswer: 2 }, { question: "Apa itu React?", choices: ["A. Bahasa pemrograman", "B. Library JavaScript untuk membangun antarmuka pengguna", "C. Aplikasi pengolah gambar", "D. Sistem operasi"], correctAnswer: 1 }, { question: "Manakah yang termasuk database relasional?", choices: ["A. MySQL", "B. MongoDB", "C. Firebase", "D. Redis"], correctAnswer: 0 }
];

let currentQuestionIndex = 0;
let score = 0;

function loadQuestion() {
  const question = quizQuestions[currentQuestionIndex];
  document.getElementById("question").textContent = question.question;

  const form = document.getElementById("quizForm");
  form.innerHTML = "";

  question.choices.forEach((choice, index) => {
    const label = document.createElement("label");
    label.className =
      "flex items-center gap-3 border rounded-lg p-4 cursor-pointer hover:bg-indigo-50 transition";

    label.innerHTML = `
      <input type="radio" name="answer" value="${index}" class="accent-indigo-600">
      <span>${choice}</span>
    `;
    form.appendChild(label);
  });

  updateProgress();
}

function updateProgress() {
  const total = quizQuestions.length;
  const current = currentQuestionIndex + 1;
  const percent = Math.round((current / total) * 100);

  document.getElementById("progressText").innerHTML =
    `<i class="fa-solid fa-list-check mr-1"></i>Soal ${current} / ${total}`;

  document.getElementById("progressPercent").textContent = percent + "%";
  document.getElementById("progressBar").style.width = percent + "%";
}

function submitAnswer() {
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) {
    alert("Silakan pilih jawaban terlebih dahulu.");
    return;
  }

  const answer = parseInt(selected.value);
  const correct = quizQuestions[currentQuestionIndex].correctAnswer;
  const result = document.getElementById("result");

  if (answer === correct) {
    score++;
    result.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Jawaban Benar!`;
    result.className = "mt-5 text-center text-green-600 font-bold";
  } else {
    result.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Jawaban Salah!`;
    result.className = "mt-5 text-center text-red-600 font-bold";
  }

  currentQuestionIndex++;

  setTimeout(() => {
    result.textContent = "";
    if (currentQuestionIndex < quizQuestions.length) {
      loadQuestion();
    } else {
      showFinalScore();
    }
  }, 1200);
}

function showFinalScore() {
  const container = document.querySelector(".quiz-container");
  const total = quizQuestions.length;
  const percent = Math.round((score / total) * 100);

  container.innerHTML = `
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-4">
      <i class="fa-solid fa-trophy mr-2"></i>Kuis Selesai
    </h2>

    <p class="text-center text-lg mb-2">
      <i class="fa-solid fa-star mr-1"></i>Skor: <b>${score}</b> / ${total}
    </p>

    <p class="text-center text-lg mb-4">
      <i class="fa-solid fa-percent mr-1"></i>Nilai: <b>${percent}%</b>
    </p>

    <div class="text-center">
      <button onclick="location.reload()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-semibold transition flex items-center justify-center gap-2 mx-auto">
        <i class="fa-solid fa-rotate-right"></i> Ulangi Kuis
      </button>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>
