<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis Interaktif</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center px-4">

  <!-- 🎵 AUDIO MUSIK -->
  <audio id="bgMusic" loop>
    <source src="WhatsApp Audio 2026-01-13 at 06.27.55.mpeg" type="audio/mpeg">
  </audio>

  <div class="bg-white w-full max-w-2xl p-6 sm:p-8 rounded-2xl shadow-2xl relative">

    <!-- 🔊 TOMBOL MUSIK -->
    <button onclick="toggleMusic()"
      class="absolute top-4 right-4 text-indigo-600 hover:text-indigo-800 text-xl">
      <i id="musicIcon" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Judul -->
    <h1 class="text-2xl sm:text-3xl font-bold text-center text-indigo-600 mb-4">
      <i class="fa-solid fa-circle-question mr-2"></i>Kuis Interaktif
    </h1>

    <!-- Progress -->
    <div class="mb-6">
      <div class="flex justify-between text-sm mb-1 text-gray-600">
        <span id="progressText">
          <i class="fa-solid fa-list-check mr-1"></i>Soal 1 / 9
        </span>
        <span id="progressPercent">11%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div id="progressBar"
          class="bg-indigo-500 h-2 rounded-full transition-all duration-300"
          style="width: 11%"></div>
      </div>
    </div>

    <!-- Konten Kuis -->
    <div class="quiz-container">
      <div id="question" class="text-lg sm:text-xl font-semibold mb-5 text-gray-800"></div>
      <form id="quizForm" class="space-y-3"></form>

      <button onclick="submitAnswer()"
        class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i>
        Kirim Jawaban
      </button>
    </div>
  </div>

<script>
/* ================== MUSIK ================== */
const bgMusic = document.getElementById("bgMusic");
const musicIcon = document.getElementById("musicIcon");
let isPlaying = false;

function toggleMusic() {
  if (!isPlaying) {
    bgMusic.volume = 0.3;
    bgMusic.play();
    musicIcon.className = "fa-solid fa-volume-high";
  } else {
    bgMusic.pause();
    musicIcon.className = "fa-solid fa-volume-xmark";
  }
  isPlaying = !isPlaying;
}

// Autoplay setelah klik pertama
document.body.addEventListener("click", () => {
  if (!isPlaying) {
    bgMusic.volume = 0.3;
    bgMusic.play();
    musicIcon.className = "fa-solid fa-volume-high";
    isPlaying = true;
  }
}, { once: true });

/* ================== DATA KUIS ================== */
const quizQuestions = [
  {
    question: "Apa saja bahasa pemrograman?",
    choices: [
      "A. PHP, Python, dan Java",
      "B. Java, C, dan Laravel",
      "C. C++, CSS, dan NextJS",
      "D. PHP, XAMPP, dan NodeJS"
    ],
    correctAnswer: 0
  },
  {
    question: "Siapa Rektor Universitas Ibrahimy?",
    choices: [
      "A. KHR. Ach Azaim Dhofir",
      "B. Albert Einstein",
      "C. Dr. H. Khoirul Anwar, M.H.I",
      "D. Gus Dur"
    ],
    correctAnswer: 2
  },
  {
    question: "Serangkaian instruksi untuk mengolah data disebut?",
    choices: [
      "A. Algoritma",
      "B. Logika",
      "C. Teknologi",
      "D. Komputer"
    ],
    correctAnswer: 0
  },
  {
    question: "Apa kepanjangan dari HTML?",
    choices: [
      "A. HyperText Makeup Language",
      "B. HyperText Markup Language",
      "C. HighText Markup Language",
      "D. HyperTool Markup Language"
    ],
    correctAnswer: 1
  },
  {
    question: "Dimana lokasi Kampus 3 Universitas Ibrahimy?",
    choices: [
      "A. Jalan Banyuwangi",
      "B. Jalan Madura, Timur Terminal",
      "C. Jalan Jawa",
      "D. Jalan Raya Situbondo"
    ],
    correctAnswer: 1
  },
  {
    question: "Program studi Fakultas Saintek?",
    choices: [
      "A. TI, SI, IK, Arsitektur, THP, BDP",
      "B. TI, Hukum, PGSD",
      "C. SI, Manajemen, Akuntansi",
      "D. Mesin & Elektro"
    ],
    correctAnswer: 0
  },
  {
    question: "Keunggulan Teknik Informatika?",
    choices: [
      "A. Teori saja",
      "B. Tidak pakai teknologi",
      "C. Peluang kerja luas IT",
      "D. Mengetik saja"
    ],
    correctAnswer: 2
  },
  {
    question: "Peluang kerja Budidaya Perikanan?",
    choices: [
      "A. Programmer",
      "B. Web Designer",
      "C. Pembudidaya & wirausaha",
      "D. Akuntan"
    ],
    correctAnswer: 2
  },
  {
    question: "Beasiswa Universitas Ibrahimy?",
    choices: [
      "A. Luar negeri",
      "B. KIP, Tahfidz, Prestasi, Pemda",
      "C. Olahraga saja",
      "D. Tidak ada"
    ],
    correctAnswer: 1
  }
];

let currentQuestionIndex = 0;
let score = 0;

function loadQuestion() {
  const q = quizQuestions[currentQuestionIndex];
  document.getElementById("question").textContent = q.question;

  const form = document.getElementById("quizForm");
  form.innerHTML = "";

  q.choices.forEach((choice, i) => {
    const label = document.createElement("label");
    label.className = "flex items-center gap-3 border rounded-lg p-4 cursor-pointer hover:bg-indigo-50";
    label.innerHTML = `
      <input type="radio" name="answer" value="${i}" class="accent-indigo-600">
      <span>${choice}</span>
    `;
    form.appendChild(label);
  });

  updateProgress();
}

function updateProgress() {
  const total = quizQuestions.length;
  const current = currentQuestionIndex + 1;
  const percent = Math.round((current / total) * 100);

  document.getElementById("progressText").innerHTML =
    `<i class="fa-solid fa-list-check mr-1"></i>Soal ${current} / ${total}`;
  document.getElementById("progressPercent").textContent = percent + "%";
  document.getElementById("progressBar").style.width = percent + "%";
}

function submitAnswer() {
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) {
    alert("Silakan pilih jawaban terlebih dahulu.");
    return;
  }

  if (parseInt(selected.value) === quizQuestions[currentQuestionIndex].correctAnswer) {
    score++;
  }

  currentQuestionIndex++;

  if (currentQuestionIndex < quizQuestions.length) {
    loadQuestion();
  } else {
    showFinalScore();
  }
}

function showFinalScore() {
  const container = document.querySelector(".quiz-container");
  const total = quizQuestions.length;
  const percent = Math.round((score / total) * 100);

  container.innerHTML = `
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-4">
      <i class="fa-solid fa-trophy mr-2"></i>Kuis Selesai
    </h2>
    <p class="text-center text-lg mb-2">Skor: <b>${score}</b> / ${total}</p>
    <p class="text-center text-lg mb-6">Nilai: <b>${percent}%</b></p>

    <div class="text-center">
      <button onclick="location.reload()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-semibold">
        <i class="fa-solid fa-rotate-right mr-1"></i>Ulangi Kuis
      </button>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>
